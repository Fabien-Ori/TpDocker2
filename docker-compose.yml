services:
  db_mongo:
    build: ./mongo
    restart: on-failure
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./mongo/init-db.js:/docker-entrypoint-initdb.d/init-db.js:ro
    healthcheck:
      test: mongosh --quiet --username admin --password admin_password --eval "if(db.getSiblingDB('blog_db').posts.countDocuments()===5)print('ok')" | grep -q ok
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 12

  db_mysql:
    image: mysql:9.2
    restart: on-failure
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -h localhost -u$MYSQL_USER -p$MYSQL_PASSWORD -D$MYSQL_DATABASE -Nse \"SELECT CASE WHEN COUNT(*) >= 3 THEN 1 ELSE 0 END FROM utilisateurs;\" | grep -q 1",
        ]
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ./api
    restart: on-failure
    env_file: .env
    depends_on:
      db_mongo:
        condition: service_healthy
      db_mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json, urllib.request, sys; posts = json.loads(urllib.request.urlopen('http://localhost:8000/posts', timeout=3).read()); users = json.loads(urllib.request.urlopen('http://localhost:8000/users', timeout=3).read()); sys.exit(0 if len(posts) == 5 and len(users) >= 3 else 1)\"",
        ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 10

  admin_mongo:
    build: ./admin_mongo
    restart: on-failure
    depends_on:
      db_mongo:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@db_mongo:27017
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('net').connect(8081, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))\"",
        ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 10

  admin_mysql:
    image: adminer
    restart: on-failure
    depends_on:
      db_mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:8080 || exit 1",
        ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
  mysql_data: