name: Build and Test Application
#Controls when the action will run
on:
#Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build_test:
    #The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build app image for scanning
        run: docker build -t my-app:1.0.0 -f ./api/Dockerfile ./api

      - name: Build Python image for scanning
        run: docker build -t my-python:1.0.0 -f ./api/Dockerfile ./api

      - name: Build mongo image for scanning
        run: docker build -t my-mongo:1.0.0 -f ./mongo/Dockerfile ./mongo

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker Scout Scan app
        uses: docker/scout-action@v1
        with:
          command: cves, recommendations
          images: my-app:1.0.0
          file: ./api/Dockerfile
          only-severities: critical,high
          exit-code: true
          only-update: true

      - name: Docker Scout Scan python
        uses: docker/scout-action@v1
        with:
          command: cves, recommendations
          images: my-python:1.0.0
          file: ./api/Dockerfile
          only-severities: critical,high
          exit-code: true
